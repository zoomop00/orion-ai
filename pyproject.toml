[project]
name = "orion-ai"
version = "0.1.0"
description = "ORION - Autonomous Market Intelligence. Mission 0-1 foundation: real XAUUSD data, validation, deterministic analysis, AI reasoning, risk guardian, decision memory. No live trading."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.69",
    "pydantic>=2.12",
    "pydantic-settings>=2.7",
    "pandas>=2.3.3",
    "numpy>=2.5",
    "httpx>=0.28",
    "sqlalchemy>=2.0.36",
    "pandas-ta-classic>=0.6.52",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.14",
    "pandas-stubs>=2.3",
    "httpx2>=2.12",
]

[project.scripts]
orion = "orion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orion"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pandas_ta_classic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sounddevice.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
