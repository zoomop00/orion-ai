name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy src

      - name: Test
        run: uv run pytest --cov=orion --cov-report=term-missing

      # The interface tests build the ASGI app in-process and never import
      # uvicorn for real (they stub it, so no server is started). This step
      # is the one place that proves the documented way to actually serve
      # ORION still resolves: the server package installs and imports, and
      # the app exposes its routes.
      - name: Interface entrypoint smoke check
        run: >
          uv run python -c "import uvicorn;
          from orion.interface.app import app, run;
          assert {r.path for r in app.routes} >= {'/health', '/v1/voice/turn', '/v1/voice/turn/text'};
          print('interface entrypoint ok')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
